[package]
name = "sprocket-rl-parser"
version = "1.3.1"
edition = "2021"
description = "Python bindings for the Rocket League replay parser boxcars."
authors = ["Jake Bailey <asaxplayinghorse@gmail.com>"]
license = "MIT"
readme = "README.md"
build = "build.rs"

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
boxcars = { git = "https://github.com/1l1venbb/boxcars", rev = "a5632f133c8c1a37b388bb0161044c16d66d3d4b" }
serde_json = "1.0.133"
pyo3 = { version = "0.22.0", features = ["generate-import-lib"] }
